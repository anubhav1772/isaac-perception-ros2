frontier_explorer:
  ros__parameters:

    # --------------- TOPICS --------------- #

    # Occupancy grid topic used to compute frontiers.
    map_topic: /map

    # Global costmap topic used to filter candidate frontiers.
    costmap_topic: /global_costmap/costmap

    # Local costmap topic used to invalidate nearby blocked frontier goals.
    local_costmap_topic: /local_costmap/costmap

    # Nav2 NavigateToPose action name.
    navigate_to_pose_action_name: navigate_to_pose

    # Global frame used for frontier goals and TF lookups.
    global_frame: map

    # Robot base frame used for TF lookups.
    # CHANGED FOR ALIENGO:
    # Original: base_footprint
    # AlienGo currently publishes odom -> base_link.
    robot_base_frame: base_link

    # MarkerArray topic used for frontier visualization in RViz.
    frontier_marker_topic: /explore/frontiers

    # Pose topic used to publish the currently selected frontier target for debugging.
    selected_frontier_topic: /explore/selected_frontier

    # OccupancyGrid topic used to publish the optimized decision map for debugging.
    optimized_map_topic: /explore/optimized_map

    # Requires completion_event_enabled: true
    completion_event_topic: exploration_complete

    # Marker size for frontier visualization.
    frontier_marker_scale: 0.15


    # --------------- QoS --------------- #

    # Map QoS profile selection.
    map_qos_durability: transient_local
    map_qos_reliability: reliable
    map_qos_depth: 1

    # Optional startup-only map durability autodetect helper.
    # CHANGED FOR ALIENGO:
    # Original: false
    # Useful while integrating RTAB-Map because it lets the explorer
    # detect the map publisher QoS during startup.
    map_qos_autodetect_on_startup: true

    map_qos_autodetect_timeout_s: 5.0

    # Costmap QoS profile selection.
    # Durability is fixed volatile in code.
    costmap_qos_reliability: reliable
    costmap_qos_depth: 10

    local_costmap_qos_reliability: inherit
    local_costmap_qos_depth: -1


    # --------------- GENERAL --------------- #

    # Refresh rate of the package.
    # 1.0 is recommended.
    # Use 2.0 if the robot is very fast.
    # Use 0.50 if mapping is slow and you want lower CPU usage.
    map_processing_rate_hz: 1.0

    # Start exploration immediately at launch.
    # CHANGED FOR ALIENGO:
    # Original: true
    # Keep false while bringing up Nav2 + ZMQ locomotion.
    # This prevents AlienGo from moving as soon as the node launches.
    autostart: false

    # Keep the optional runtime control service available for
    # manual stop/start flows.
    # CHANGED FOR ALIENGO:
    # Original: false
    # Enable it so exploration can be started manually after
    # checking the map, TF tree, Nav2 and costmaps.
    control_service_enabled: true

    # Publish a completion event so product-specific integrations
    # can react outside the package.
    completion_event_enabled: true

    # Allow a farther frontier fallback until the first successful frontier.
    # Useful if you have a very low-range LiDAR or depth sensor.
    escape_enabled: true

    # Return to the recorded start pose once no frontiers remain.
    return_to_start_on_complete: false

    # "dp" optimizes traveling distance by comparing possibilities
    # with limited depth. More efficient, but adds CPU overhead.
    #
    # "greedy" traverses the full MRTSP matrix one step at a time.
    mrtsp_solver: dp

    # Maximum number of scored frontier candidates passed into
    # the bounded-horizon DP solver.
    dp_solver_candidate_limit: 12

    # Number of distinct frontier visits evaluated in the candidate pool.
    dp_planning_horizon: 8

    # Enable decision-map preprocessing for frontier extraction.
    # Disable only if you are having performance issues.
    frontier_map_optimization_enabled: true

    # Replan while navigating if target-pose visible reveal gain
    # for the active goal is exhausted.
    goal_preemption_enabled: true

    # Minimum seconds between consecutive goal preemption attempts.
    goal_preemption_min_interval_s: 2.0

    # Skip the active frontier goal if it becomes blocked.
    goal_skip_on_blocked_goal: true

    # Enable post-goal settle delay after a successful frontier goal.
    # Useful for slow SLAM/sensor configurations.
    post_goal_settle_enabled: false

    # Minimum seconds to wait before selecting the next frontier
    # after a successful goal.
    post_goal_min_settle: 1.50

    # Enable temporary suppression for frontiers that repeatedly fail or stall.
    frontier_suppression_enabled: false

    # Behavior when frontiers exist but all are temporarily suppressed.
    # Requires frontier_suppression_enabled: true.
    all_frontiers_suppressed_behavior: return_to_start


    # ============================================================
    # Algorithm Configuration - Advanced Users
    # ============================================================


    # --------------- MRTSP Scoring --------------- #

    # Weight applied to the path-cost term in the frontier cost matrix.
    #
    # Higher:
    #   more distance-sensitive / conservative.
    #
    # Lower:
    #   information gain dominates more often.
    #
    # Example:
    #   2.0 prefers closer frontiers.
    #   0.5 allows farther high-gain frontiers.
    weight_distance_wd: 1.0

    # Weight applied to the frontier information-gain term.
    #
    # Higher:
    #   favors large frontier clusters.
    #
    # Lower:
    #   tends to clean nearby small frontiers first.
    weight_gain_ws: 1.0

    # Maximum linear speed used only in the lower-bound time term.
    #
    # This DOES NOT command AlienGo.
    # It is only used for estimating frontier traversal time.
    max_linear_speed_vmax: 0.50

    # Maximum angular speed used in the heading-change component
    # of the time lower bound.
    #
    # This DOES NOT directly command AlienGo.
    max_angular_speed_wmax: 1.0

    # Effective sensor range used in the path-cost scoring term.
    #
    # This does not have to exactly equal the physical sensor range.
    sensor_effective_range_m: 1.5


    # --------------- Navigation Safety --------------- #

    # Minimum distance before a frontier is considered a valid target.
    #
    # Used for dispatch rather than frontier filtering.
    #
    # Package recommendation:
    # approximately 2.5 x robot radius.
    frontier_selection_min_distance: 0.8

    # Distance used to treat a frontier region as recently visited.
    # Useful for preventing navigation loops.
    frontier_visit_tolerance: 0.40


    # --------------- Map Optimization --------------- #

    # Minimum allowed distance from robot to a frontier candidate.
    #
    # Prevents trivially close goals that do not significantly
    # advance exploration.
    frontier_candidate_min_goal_distance_m: 0.8

    # Occupancy threshold applied to the global costmap during
    # frontier validation.
    #
    # Neighbor cells at or above this cost are considered blocked.
    #
    # Range: 0-100.
    occ_threshold: 65

    # Minimum connected frontier size accepted by WFD, in cells.
    #
    # Removes tiny frontier fragments caused by map noise.
    min_frontier_size_cells: 5

    # Spatial sigma of the bilateral filter in map cells.
    #
    # Larger values smooth over wider neighborhoods.
    sigma_s: 2.0

    # Range sigma of the bilateral filter in occupancy-image
    # intensity space.
    #
    # Smaller values preserve occupancy boundaries more strongly.
    sigma_r: 30.0

    # Free-space dilation radius after bilateral filtering, in cells.
    #
    # Larger values may bridge tiny gaps, but excessive values can
    # incorrectly open narrow obstacles/door thresholds.
    dilation_kernel_radius_cells: 1


    # --------------- Preemption --------------- #

    # Treat the current frontier as complete once the robot is this
    # close to it.
    #
    # 0.0 disables this shortcut.
    goal_preemption_complete_if_within_m: 0.50

    # Range used by the map-based visible-reveal gate.
    #
    # IMPORTANT:
    # Leave this package default unchanged during initial bring-up.
    # We can tune this later for the RGB-D camera.
    goal_preemption_lidar_range_m: 12.0

    # Field of view used by the visible-reveal gate.
    #
    # IMPORTANT:
    # Leave this package default unchanged during initial bring-up.
    # We can tune it later for your ~87 deg RGB-D camera.
    goal_preemption_lidar_fov_deg: 360.0

    # Angular spacing between ray-cast samples.
    goal_preemption_lidar_ray_step_deg: 1.0

    # Minimum visible reveal length required to keep the current
    # goal instead of preempting.
    goal_preemption_lidar_min_reveal_length_m: 0.5

    # Additional yaw offset applied to the target-pose sensor
    # heading model.
    goal_preemption_lidar_yaw_offset_deg: 0.0


    # --------------- Suppression --------------- #

    # Number of failed attempts before a frontier area is
    # temporarily suppressed.
    frontier_suppression_attempt_threshold: 2

    # Initial side length, in meters, of a newly suppressed square region.
    frontier_suppression_base_size_m: 1.0

    # Additional outer-ring width used when detecting repeated failures
    # around an existing suppressed region.
    frontier_suppression_expansion_size_m: 0.5

    # Lifetime of a suppression entry before it expires.
    frontier_suppression_timeout_s: 90.0

    # Maximum allowed time without meaningful navigation progress
    # before a frontier goal is canceled.
    frontier_suppression_no_progress_timeout_s: 20.0

    # Minimum distance_remaining improvement required to count
    # as navigation progress.
    frontier_suppression_progress_epsilon_m: 0.25

    # Startup grace period before suppression logic becomes active.
    #
    # Prevents late Nav2 bring-up from incorrectly poisoning
    # frontier failure memory.
    frontier_suppression_startup_grace_period_s: 15.0

    # Maximum number of failed-frontier attempt records kept in memory.
    frontier_suppression_max_attempt_records: 256

    # Maximum number of active suppressed regions kept in memory.
    frontier_suppression_max_regions: 64